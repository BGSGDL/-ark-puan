<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şans Çarkı</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #100d25; color: white; font-family: Arial; text-align: center; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.header { display: flex; justify-content: space-between; width: 100%; max-width: 440px; padding: 8px; }
.balance-box { background: #2d1b5c; border: 2px solid #a855f7; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
.btn-top { color: white; border: none; padding: 6px 10px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 10px; }
.modal { position: fixed; inset: 0; background: rgba(10, 6, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
.modal-box { background: #1e1344; border: 2px solid #a855f7; border-radius: 20px; padding: 20px; width: 100%; max-width: 340px; text-align: center; }
.modal-box input, .modal-box textarea { width: 100%; padding: 10px; margin: 6px 0; border-radius: 10px; border: 1px solid #6b21a8; background: #0f0924; color: white; }
.modal-btn { width: 100%; padding: 11px; margin-top: 8px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: #22c55e; color: white; }
.hidden { display: none !important; }
.spin-btn { width: 100%; max-width: 360px; background: #ca8a04; color: white; border: 3px solid #fef08a; border-radius: 25px; padding: 14px; font-size: 18px; font-weight: bold; cursor: pointer; margin: 10px 0; }
</style>
</head>
<body>

<div id="authModal" class="modal">
    <div class="modal-box">
        <h2 id="authTitle">Kayıt Ol</h2>
        <input type="text" id="usernameInput" placeholder="Kullanıcı Adı" autocomplete="off">
        <input type="password" id="passwordInput" placeholder="Şifre">
        <div id="authError" style="color:#f87171; font-size:11px; margin-top:3px;"></div>
        <button type="button" class="modal-btn" onclick="handleAuth()">Devam Et</button>
        <div id="authSwitch" style="margin-top:10px; font-size:12px; color:#c084fc; cursor:pointer;" onclick="toggleAuthMode()">Zaten hesabın var mı? Giriş Yap</div>
    </div>
</div>

<div id="depositModal" class="modal hidden">
    <div class="modal-box">
        <h2>Para Yükle</h2>
        <input type="number" id="depositAmount" placeholder="Yatırılan Tutar (TL)">
        <input type="text" id="depositName" placeholder="Gönderen Ad Soyad">
        <button type="button" onclick="submitDeposit()" class="modal-btn">Gönder</button>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563;">İptal</button>
    </div>
</div>

<div id="withdrawModal" class="modal hidden">
    <div class="modal-box">
        <h2>Para Çek</h2>
        <p id="withdrawInfo" style="font-size:11px;">Bakiye: 0 TL</p>
        <input type="number" id="withdrawAmount" placeholder="Tutar">
        <input type="text" id="withdrawName" placeholder="Ad Soyad">
        <input type="text" id="withdrawIban" placeholder="TR IBAN (26 hane)">
        <button type="button" onclick="submitWithdraw()" class="modal-btn" style="background:#3b82f6;">Talep Ver</button>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563;">İptal</button>
    </div>
</div>

<div id="historyModal" class="modal hidden">
    <div class="modal-box">
        <h2>Geçmiş</h2>
        <div id="historyList" style="max-height:150px; overflow-y:auto; text-align:left;"></div>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563;">Kapat</button>
    </div>
</div>

<div id="supportModal" class="modal hidden">
    <div class="modal-box">
        <h2>Destek</h2>
        <textarea id="supportMessage" placeholder="Mesajınız..." rows="3"></textarea>
        <button type="button" onclick="submitSupport()" class="modal-btn" style="background:#f97316;">Gönder</button>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563;">Kapat</button>
    </div>
</div>

<div id="adminModal" class="modal hidden">
    <div class="modal-box">
        <h2 style="color:#eab308;">👑 Yönetim</h2>
        <div id="adminRequestsList" style="max-height:200px; overflow-y:auto;"></div>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563;">Kapat</button>
    </div>
</div>

<div class="header">
    <div class="balance-box">⭐ <span id="points">0</span> TL</div>
    <div>
        <button type="button" class="btn-top" style="background:#22c55e;" onclick="openModal('depositModal')">Yükle</button>
        <button type="button" class="btn-top" style="background:#3b82f6;" onclick="openModal('withdrawModal')">Çek</button>
        <button type="button" class="btn-top" style="background:#a855f7;" onclick="openHistory()">Geçmiş</button>
        <button type="button" class="btn-top" style="background:#f97316;" onclick="openModal('supportModal')">Destek</button>
        <button type="button" id="adminBtn" class="btn-top" style="background:#eab308; display:none;" onclick="openAdminPanel()">Yönetim</button>
    </div>
</div>

<div>
    <span>Hesap: <b id="activeUser">-</b></span>
    <button type="button" style="background:none; border:none; color:#f87171; cursor:pointer;" onclick="logout()">Çıkış</button>
</div>

<div>
    <h1>ŞANS ÇARKI</h1>
</div>

<div>
    <canvas id="wheel" width="300" height="300" style="width:250px; height:250px;"></canvas>
</div>

<div id="message">Şansını dene!</div>
<button type="button" id="spin" class="spin-btn">ÇEVİR (10 TL)</button>

<script src="script.js"></script>
</body>
</html>
