<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şans Çarkı</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: radial-gradient(circle, #2a0845 0%, #100d25 100%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}
.header {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    padding: 8px 4px;
    align-items: center;
    gap: 4px;
}
.balance-box {
    background: linear-gradient(135deg, #181035, #2d1b5c);
    border: 2px solid #a855f7;
    padding: 6px 10px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 13px;
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    white-space: nowrap;
}
.balance-box span { color: #facc15; font-size: 15px; }
.top-buttons {
    display: flex;
    gap: 4px;
}
.btn-top {
    color: white;
    border: none;
    padding: 7px 9px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
}
.btn-deposit { background: linear-gradient(135deg, #22c55e, #15803d); box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
.btn-withdraw { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }
.btn-history { background: linear-gradient(135deg, #a855f7, #6b21a8); box-shadow: 0 0 8px rgba(168, 85, 247, 0.5); }

.user-bar {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #d8b4fe;
    padding: 0 8px;
}
.logout-btn {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid #ef4444;
    color: #fca5a5;
    border-radius: 10px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
}
.wheel-container {
    position: relative;
    width: min(82vw, 320px);
    margin: 5px auto;
}
canvas {
    width: 100%;
    height: auto;
    filter: drop-shadow(0 0 20px rgba(234, 179, 8, 0.4));
}
.pointer {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; 
    height: 0; 
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 28px solid #ef4444;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    z-index: 10;
}
.spin-btn {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(to bottom, #fde047, #ca8a04);
    color: #422006;
    border: 3px solid #fef08a;
    border-radius: 25px;
    padding: 14px;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 #854d0e, 0 0 25px rgba(250, 204, 21, 0.7);
    text-transform: uppercase;
    margin: 10px 0;
    letter-spacing: 1px;
}
.spin-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #854d0e, 0 0 15px rgba(250, 204, 21, 0.7);
}
.spin-btn:disabled { opacity: 0.6; transform: none; }
#message {
    min-height: 24px;
    font-size: 15px;
    font-weight: bold;
    color: #facc15;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(10, 6, 25, 0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
}
.modal-box {
    background: linear-gradient(145deg, #1e1344, #120b29);
    border: 2px solid #a855f7;
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
    text-align: center;
    max-height: 85vh;
    overflow-y: auto;
}
.modal-box h2 { margin-top: 0; color: #fde047; font-size: 19px; }
.modal-box input, .modal-box textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid #6b21a8;
    background: #0f0924;
    color: white;
    font-size: 13px;
}
.modal-btn {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    background: linear-gradient(135deg, #22c55e, #15803d);
    color: white;
}
.switch-text {
    margin-top: 10px;
    font-size: 12px;
    color: #c084fc;
    cursor: pointer;
    text-decoration: underline;
}
.hidden { display: none !important; }
.history-item {
    background: rgba(255,255,255,0.05);
    padding: 8px;
    margin: 5px 0;
    border-radius: 8px;
    font-size: 12px;
    text-align: left;
    display: flex;
    justify-content: space-between;
}
</style>
</head>
<body>

<div id="authModal" class="modal">
    <div class="modal-box">
        <h2 id="authTitle">Kayıt Ol</h2>
        <input type="text" id="usernameInput" placeholder="Kullanıcı Adı" autocomplete="off">
        <input type="password" id="passwordInput" placeholder="Şif
