<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şans Çarkı</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: radial-gradient(circle, #2a0845 0%, #100d25 100%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}
.header {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    padding: 8px 4px;
    align-items: center;
    gap: 3px;
}
.balance-box {
    background: linear-gradient(135deg, #181035, #2d1b5c);
    border: 2px solid #a855f7;
    padding: 6px 8px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 12px;
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    white-space: nowrap;
}
.balance-box span { color: #facc15; font-size: 14px; }
.top-buttons {
    display: flex;
    gap: 3px;
}
.btn-top {
    color: white;
    border: none;
    padding: 6px 7px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 10px;
    cursor: pointer;
    white-space: nowrap;
}
.btn-deposit { background: linear-gradient(135deg, #22c55e, #15803d); box-shadow: 0 0 6px rgba(34, 197, 94, 0.5); }
.btn-withdraw { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 0 6px rgba(59, 130, 246, 0.5); }
.btn-history { background: linear-gradient(135deg, #a855f7, #6b21a8); box-shadow: 0 0 6px rgba(168, 85, 247, 0.5); }
.btn-support { background: linear-gradient(135deg, #f97316, #c2410c); box-shadow: 0 0 6px rgba(249, 115, 22, 0.5); }

.user-bar {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: space-between;
    align-items: center;

    <script>
let users = JSON.parse(localStorage.getItem("wheelUsers") || "{}");
let currentUser = localStorage.getItem("wheelCurrentUser") || null;
let isRegisterMode = true;

const authModal = document.getElementById("authModal");
const authTitle = document.getElementById("authTitle");
const authSubmitBtn = document.getElementById("authSubmitBtn");
const authSwitch = document.getElementById("authSwitch");
const authError = document.getElementById("authError");
const pointText = document.getElementById("points");
const activeUserText = document.getElementById("activeUser");
const message = document.getElementById("message");

document.getElementById("depositFile").onchange = (e) => {
    const file = e.target.files[0];
    if(file) {
        document.getElementById("fileNameDisplay").textContent = "Seçilen Dosya: " + file.name;
    }
};

function checkAuth() {
    if (currentUser && users[currentUser]) {
        authModal.style.display = "none";
        activeUserText.textContent = currentUser;
        updateBalanceUI();
    } else {
        authModal.style.display = "flex";
    }
}

function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    authError.textContent = "";
    if (isRegisterMode) {
        authTitle.textContent = "Kayıt Ol";
        authSubmitBtn.textContent = "Kayıt Ol ve Başla";
        authSwitch.textContent = "Zaten hesabın var mı? Giriş Yap";
    } else {
        authTitle.textContent = "Giriş Yap";
        authSubmitBtn.textContent = "Giriş Yap";
        authSwitch.textContent = "Hesabın yok mu? Kayıt Ol";
    }
}

function handleAuth() {
    const uname = document.getElementById("usernameInput").value.trim();
    const pass = document.getElementById("passwordInput").value.trim();
    
    if (!uname || !pass) {
        authError.textContent = "Kullanıcı adı ve şifre boş bırakılamaz.";
        return;
    }

    if (isRegisterMode) {
        if (users[uname]) {
            authError.textContent = "Bu kullanıcı adı zaten alınmış.";
            return;
        }
        users[uname] = { password: pass, balance: 50, history: [] };
    } else {
        if (!users[uname] || users[uname].password !== pass) {
            authError.textContent = "Kullanıcı adı veya şifre hatalı.";
            return;
        }
    }

    localStorage.setItem("wheelUsers", JSON.stringify(users));
    currentUser = uname;
    localStorage.setItem("wheelCurrentUser", currentUser);
    
    authModal.style.display = "none";
    activeUserText.textContent = currentUser;
    updateBalanceUI();
}

function logout() {
    currentUser = null;
    localStorage.removeItem("wheelCurrentUser");
    document.getElementById("usernameInput").value = "";
    document.getElementById("passwordInput").value = "";
    authError.textContent = "";
    authModal.style.display = "flex";
}

function updateBalanceUI() {
    if (currentUser && users[currentUser]) {
        pointText.textContent = users[currentUser].balance;
        if(!users[currentUser].history) users[currentUser].history = [];
    }
}

function openModal(id) {
    if(id === 'withdrawModal') {
        document.getElementById("withdrawInfo").textContent = "Çekilebilecek Bakiye: " + users[currentUser].balance + " TL";
        document.getElementById("withdrawAmount").value = "";
        document.getElementById("withdrawName").value = "";
        document.getElementById("withdrawIban").value = "";
    }
    if(id === 'depositModal') {
        document.getElementById("depositAmount").value = "";
        document.getElementById("depositName").value = "";
        document.getElementById("depositFile").value = "";
        document.getElementById("fileNameDisplay").textContent = "";
    }
    if(id === 'supportModal') {
        document.getElementById("supportMessage").value = "";
    }
    document.getElementById(id).classList.remove("hidden");
}

function closeModals() {
    document.querySelectorAll('.modal').forEach(m => {
        if(m.id !== 'authModal') m.classList.add("hidden");
    });
}

function submitDeposit() {
    const amount = Number(document.getElementById("depositAmount").value);
    const name = document.getElementById("depositName").value.trim();
    const fileInput = document.getElementById("depositFile").files[0];

    if(!amount || amount <= 0 || !name || !fileInput) {
        alert("Lütfen tutar, ad soyad girin ve dekont dosyası seçin.");
        return;
    }

    users[currentUser].balance += amount;
    users[currentUser].history.unshift({text: "+" + amount + " TL Yatırıldı (" + name + " - " + fileInput.name + ")", date: new Date().toLocaleDateString()});
    localStorage.setItem("wheelUsers", JSON.stringify(users));
    updateBalanceUI();
    closeModals();
    
    alert("Bildirim: " + currentUser + " adlı kullanıcı " + amount + " TL para yatırma bildirimi gönderdi!");
    message.textContent = amount + " TL bakiye hesabınıza eklendi!";
}

function submitWithdraw() {
    const amount = Number(document.getElementById("withdrawAmount").value);
    const name = document.getElementById("withdrawName").value.trim();
    const iban = document.getElementById("withdrawIban").value.trim().toUpperCase();

    if(!amount || amount <= 0 || !name || !iban) {
        alert("Lütfen tüm alanları doldurun.");
        return;
    }

    if(!iban.startsWith("TR") || iban.length !== 26) {
        alert("Geçersiz IBAN! Lütfen 'TR' ile başlayan 26 haneli geçerli bir IBAN girin.");
        return;
    }

    if(amount > users[currentUser].balance) {
        alert("Yetersiz bakiye!");
        return;
    }

    users[currentUser].balance -= amount;
    users[currentUser].history.unshift({text: "-" + amount + " TL Çekildi (" + name + " - " + iban.slice(0,8) + "...)", date: new Date().toLocaleDateString()});
    localStorage.setItem("wheelUsers", JSON.stringify(users));
    updateBalanceUI();
    closeModals();

    alert("Bildirim: " + currentUser + " adlı kullanıcı " + amount + " TL para çekme talebi oluşturdu! IBAN: " + iban);
    message.textContent = amount + " TL çekim talebi alındı!";
}

function submitSupport() {
    const text = document.getElementById("supportMessage").value.trim();
    if(!text) {
        alert("Lütfen bir mesaj yazın.");
        return;
    }
    alert("Destek talebiniz yöneticiye iletildi. En kısa sürede dönüş yapılacaktır.");
    closeModals();
}

function openHistory() {
    const listDiv = document.getElementById("historyList");
    listDiv.innerHTML = "";
    const hist = users[currentUser].history || [];
    if(hist.length === 0) {
        listDiv.innerHTML = "<div style='font-size:12px; color:#aaa; text-align:center;'>Henüz işlem geçmişi yok.</div>";
    } else {
        hist.forEach(h => {
            listDiv.innerHTML += `<div class="history-item"><span>${h.text}</span><span style="color:#aaa; font-size:10px;">${h.date}</span></div>`;
        });
    }
    document.getElementById("historyModal").classList.remove("hidden");
}

const prizes = [100, 50, 20, 10, 10, 5, 5, 1, 1, 1, 1, 1, 1, 5, 5, 10, 10, 20, 50, 100];
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const size = canvas.width, center = size / 2, radius = 280;
const colors = ["#9333ea", "#0ea5e9", "#22c55e", "#f97316", "#ef4444"];
let angle = 0, spinning = false;

function draw() {
    ctx.clearRect(0, 0, size, size);
    const step = Math.PI * 2 / prizes.length;

    prizes.forEach((p, i) => {
        let start = angle + i * step;
        let end = start + step;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = "#fef08a";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(start + step / 2);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "right";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 4;
        ctx.fillText(p + " TL", radius - 25, 8);
        ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(center, center, 50, 0, Math.PI * 2);
    ctx.fillStyle = "#ca8a04";
    ctx.fill();
    ctx.strokeStyle = "#fef08a";
    ctx.lineWidth = 8;
    ctx.stroke();

    ctx.fillStyle = "#fde047";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("★", center, center);
}

draw();
checkAuth();

function getWeightedPrizeIndex() {
    const rnd = Math.random() * 1000;
    let targetValue = 1;

    if (rnd < 2) targetValue = 100;
    else if (rnd < 8) targetValue = 50;
    else if (rnd < 40) targetValue = 20;
    else if (rnd < 150) targetValue = 10;
    else if (rnd < 450) targetValue = 5;
    else targetValue = 1;

    let matchingIndices = [];
    prizes.forEach((p, idx) => { if (p === targetValue) matchingIndices.push(idx); });
    return matchingIndices[Math.floor(Math.random() * matchingIndices.length)];
}

document.getElementById("spin").onclick = () => {
    if (spinning || !currentUser) return;

    if (users[currentUser].balance < 10) {
        alert("Yetersiz bakiye! Çarkı çevirmek için en az 10 TL gereklidir.");
        return;
    }

    users[currentUser].balance -= 10;
    if(!users[currentUser].history) users[currentUser].history = [];
    users[currentUser].history.unshift({text: "Çeviri Ücreti: -10 TL", date: new Date().toLocaleDateString()});
    localStorage.setItem("wheelUsers", JSON.stringify(users));
    updateBalanceUI();

    spinning = true;
    document.getElementById("spin").disabled = true;
    message.textContent = "Çark dönüyor...";

    const chosen = getWeightedPrizeIndex();
    const step = Math.PI * 2 / prizes.length;
    const targetAngle = -Math.PI / 2 - (chosen * step) - (step / 2);
    const extraTurns = 8 * Math.PI * 2;
    const currentAngle = angle;
    
    const relativeTarget = (targetAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    const currentMod = (currentAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    let diff = relativeTarget - currentMod;
    if (diff < 0) diff += Math.PI * 2;

    const finish = currentAngle + extraTurns + diff;
    const duration = 5000, begin = performance.now();

    function animate(now) {
        let t = Math.min(1, (now - begin) / duration);
        let ease = 1 - Math.pow(1 - t, 4);
        angle = currentAngle + (finish - currentAngle) * ease;
        draw();

        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            angle = finish;
            draw();
            users[currentUser].balance += prizes[chosen];
            users[currentUser].history.unshift({text: "Çarktan Kazanıldı: +" + prizes[chosen] + " TL", date: new Date().toLocaleDateString()});
            localStorage.setItem("wheelUsers", JSON.stringify(users));
            updateBalanceUI();
            message.textContent = "Tebrikler! " + prizes[chosen] + " TL kazandın!";
            spinning = false;
            document.getElementById("spin").disabled = false;
        }
    }
    requestAnimationFrame(animate);
};
</script>
</body>
</html>
