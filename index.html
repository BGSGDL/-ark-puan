<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şans Çarkı</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: radial-gradient(circle, #2a0845 0%, #100d25 100%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}
.header {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    padding: 8px 4px;
    align-items: center;
    gap: 3px;
}
.balance-box {
    background: linear-gradient(135deg, #181035, #2d1b5c);
    border: 2px solid #a855f7;
    padding: 6px 8px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 12px;
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    white-space: nowrap;
}
.balance-box span { color: #facc15; font-size: 14px; }
.top-buttons { display: flex; gap: 3px; }
.btn-top {
    color: white; border: none; padding: 6px 7px; border-radius: 10px;
    font-weight: bold; font-size: 10px; cursor: pointer; white-space: nowrap;
}
.btn-deposit { background: linear-gradient(135deg, #22c55e, #15803d); }
.btn-withdraw { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
.btn-history { background: linear-gradient(135deg, #a855f7, #6b21a8); }
.btn-support { background: linear-gradient(135deg, #f97316, #c2410c); }
.btn-admin { background: linear-gradient(135deg, #eab308, #ca8a04); display: none; }

.user-bar {
    width: 100%; max-width: 440px; display: flex; justify-content: space-between;
    align-items: center; font-size: 12px; color: #d8b4fe; padding: 0 8px;
}
.logout-btn {
    background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444;
    color: #fca5a5; border-radius: 10px; padding: 3px 8px; font-size: 11px; cursor: pointer;
}
.wheel-container { position: relative; width: min(82vw, 320px); margin: 5px auto; }
canvas { width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(234, 179, 8, 0.4)); }
.pointer {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 14px solid transparent;
    border-right: 14px solid transparent; border-top: 28px solid #ef4444; z-index: 10;
}
.spin-btn {
    width: 100%; max-width: 360px; background: linear-gradient(to bottom, #fde047, #ca8a04);
    color: #422006; border: 3px solid #fef08a; border-radius: 25px; padding: 14px;
    font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #854d0e;
    text-transform: uppercase; margin: 10px 0;
}
.spin-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #854d0e; }
.spin-btn:disabled { opacity: 0.6; transform: none; }
#message { min-height: 24px; font-size: 15px; font-weight: bold; color: #facc15; }

.modal {
    position: fixed; inset: 0; background: rgba(10, 6, 25, 0.98);
    display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px;
}
.modal-box {
    background: linear-gradient(145deg, #1e1344, #120b29); border: 2px solid #a855f7;
    border-radius: 20px; padding: 20px; width: 100%; max-width: 340px; text-align: center;
}
.modal-box h2 { margin-top: 0; color: #fde047; font-size: 18px; }
.modal-box input, .modal-box textarea {
    width: 100%; padding: 10px; margin: 6px 0; border-radius: 10px;
    border: 1px solid #6b21a8; background: #0f0924; color: white; font-size: 13px;
}
.modal-btn {
    width: 100%; padding: 11px; margin-top: 8px; border: none; border-radius: 10px;
    font-weight: bold; font-size: 14px; cursor: pointer; background: linear-gradient(135deg, #22c55e, #15803d); color: white;
}
.switch-text { margin-top: 10px; font-size: 12px; color: #c084fc; cursor: pointer; text-decoration: underline; }
.hidden { display: none !important; }
.history-item {
    background: rgba(255,255,255,0.05); padding: 8px; margin: 4px 0;
    border-radius: 8px; font-size: 11px; text-align: left; display: flex; justify-content: space-between; align-items: center;
}
.admin-card {
    background: rgba(168, 85, 247, 0.1); border: 1px solid #a855f7; padding: 10px;
    margin: 8px 0; border-radius: 10px; font-size: 11px; text-align: left;
}
</style>
</head>
<body>

<div id="authModal" class="modal">
    <div class="modal-box">
        <h2 id="authTitle">Kayıt Ol</h2>
        <input type="text" id="usernameInput" placeholder="Kullanıcı Adı" autocomplete="off">
        <input type="password" id="passwordInput" placeholder="Şifre">
        <div id="authError" style="color:#f87171; font-size:11px; margin-top:3px;"></div>
        <button type="button" class="modal-btn" onclick="handleAuth()">Devam Et</button>
        <div id="authSwitch" class="switch-text" onclick="toggleAuthMode()">Zaten hesabın var mı? Giriş Yap</div>
    </div>
</div>

<div id="depositModal" class="modal hidden">
    <div class="modal-box">
        <h2>Para Yükle</h2>
        <input type="number" id="depositAmount" placeholder="Yatırılan Tutar (TL)">
        <input type="text" id="depositName" placeholder="Gönderen Ad Soyad">
        <button type="button" onclick="submitDeposit()" class="modal-btn">Gönder</button>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563; margin-top:4px;">İptal</button>
    </div>
</div>

<div id="withdrawModal" class="modal hidden">
    <div class="modal-box">
        <h2>Para Çek</h2>
        <p style="font-size:11px; color:#e9d5ff; margin-bottom:6px;" id="withdrawInfo">Çekilebilecek Bakiye: 0 TL</p>
        <input type="number" id="withdrawAmount" placeholder="Çekilecek Tutar (TL)">
        <input type="text" id="withdrawName" placeholder="Ad Soyad">
        <input type="text" id="withdrawIban" placeholder="TR ile başlayan 26 haneli IBAN">
        <button type="button" onclick="submitWithdraw()" class="modal-btn" style="background:#3b82f6;">Çekim Talebi Ver</button>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563; margin-top:4px;">İptal</button>
    </div>
</div>

<div id="historyModal" class="modal hidden">
    <div class="modal-box">
        <h2>İşlem Geçmişi</h2>
        <div id="historyList" style="max-height:180px; overflow-y:auto; margin:8px 0;"></div>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563;">Kapat</button>
    </div>
</div>

<div id="supportModal" class="modal hidden">
    <div class="modal-box">
        <h2>Destek Hattı</h2>
        <textarea id="supportMessage" placeholder="Mesajınızı buraya yazın..." rows="3"></textarea>
        <button type="button" onclick="submitSupport()" class="modal-btn" style="background:#f97316;">Destek Talebi Gönder</button>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563; margin-top:4px;">Kapat</button>
    </div>
</div>

<div id="adminModal" class="modal hidden">
    <div class="modal-box" style="max-width:380px;">
        <h2 style="color:#eab308;">👑 Yönetici Paneli</h2>
        <div id="adminRequestsList" style="max-height:240px; overflow-y:auto; margin:8px 0;"></div>
        <button type="button" onclick="closeModals()" class="modal-btn" style="background:#4b5563;">Paneli Kapat</button>
    </div>
</div>

<div class="header">
    <div class="balance-box">⭐ <span id="points">0</span> TL</div>
    <div class="top-buttons">
        <button type="button" class="btn-top btn-deposit" onclick="openModal('depositModal')">Yükle</button>
        <button type="button" class="btn-top btn-withdraw" onclick="openModal('withdrawModal')">Çek</button>
        <button type="button" class="btn-top btn-history" onclick="openHistory()">Geçmiş</button>
        <button type="button" class="btn-top btn-support" onclick="openModal('supportModal')">Destek</button>
        <button type="button" id="adminBtn" class="btn-top btn-admin" onclick="openAdminPanel()">Yönetim</button>
    </div>
</div>

<div class="user-bar">
    <span>👤 Hesap: <b id="activeUser">-</b></span>
    <button type="button" class="logout-btn" onclick="logout()">Çıkış Yap</button>
</div>

<div>
    <h1 style="margin:2px 0; color:#fef08a; font-size:22px;">ŞANS ÇARKI</h1>
    <div style="font-size:12px; color:#facc15; margin-bottom:4px;">Çeviri Ücreti: 10 TL</div>
</div>

<div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="600" height="600"></canvas>
</div>

<div id="message">Şansını dene, büyük ödüller kazan!</div>
<button type="button" id="spin" class="spin-btn">ÇARKI ÇEVİR (10 TL)</button>

<script>
let users = JSON.parse(localStorage.getItem("wheelUsers") || "{}");
let adminRequests = JSON.parse(localStorage.getItem("wheelAdminReq") || "[]");
let currentUser = localStorage.getItem("wheelCurrentUser") || null;
let isRegisterMode = true;

const authModal = document.getElementById("authModal");
const authTitle = document.getElementById("authTitle");
const authSubmitBtn = document.getElementById("authSubmitBtn");
const authSwitch = document.getElementById("authSwitch");
const authError = document.getElementById("authError");
const pointText = document.getElementById("points");
const activeUserText = document.getElementById("activeUser");
const message = document.getElementById("message");
const adminBtn = document.getElementById("adminBtn");

function checkAdminAccess() {
    if (currentUser === "BGSGDL") {
        if(adminBtn) adminBtn.style.display = "inline-block";
    } else {
        if(adminBtn) adminBtn.style.display = "none";
    }
}

function checkAuth() {
    if (currentUser && users[currentUser]) {
        if(authModal) authModal.style.display = "none";
        if(activeUserText) activeUserText.textContent = currentUser;
        updateBalanceUI();
        checkAdminAccess();
    } else {
        if(authModal) authModal.style.display = "flex";
        if(adminBtn) adminBtn.style.display = "none";
    }
}

function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    if(authError) authError.textContent = "";
    if (isRegisterMode) {
        if(authTitle) authTitle.textContent = "Kayıt Ol";
        if(authSubmitBtn) authSubmitBtn.textContent = "Devam Et";
        if(authSwitch) authSwitch.textContent = "Zaten hesabın var mı? Giriş Yap";
    } else {
        if(authTitle) authTitle.textContent = "Giriş Yap";
        if(authSubmitBtn) authSubmitBtn.textContent = "Giriş Yap";
        if(authSwitch) authSwitch.textContent = "Hesabın yok mu? Kayıt Ol";
    }
}

function handleAuth() {
    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");
    if (!usernameInput || !passwordInput) return;
    
    const uname = usernameInput.value.trim();
    const pass = passwordInput.value.trim();
    
    if (!uname || !pass) { 
        if(authError) authError.textContent = "Kullanıcı adı ve şifre boş bırakılamaz."; 
        return; 
    }

    if (isRegisterMode) {
        if (users[uname]) { 
            if(authError) authError.textContent = "Bu kullanıcı adı zaten alınmış."; 
            return; 
        }
        users[uname] = { password: pass, balance: 0, history: [] };
    } else {
        if (!users[uname] || users[uname].password !== pass) { 
            if(authError) authError.textContent = "Kullanıcı adı veya şifre hatalı."; 
            return; 
        }
    }

    localStorage.setItem("wheelUsers", JSON.stringify(users));
    currentUser = uname;
    localStorage.setItem("wheelCurrentUser", currentUser);
    checkAuth();
}

function logout() {
    currentUser = null;
    localStorage.removeItem("wheelCurrentUser");
    checkAuth();
}

function updateBalanceUI() {
    if (currentUser && users[currentUser]) {
        if(pointText) pointText.textContent = users[currentUser].balance;
        if(!users[currentUser].history) users[currentUser].history = [];
    }
}

function openModal(id) {
    if(id === 'withdrawModal' && currentUser) {
        const info = document.getElementById("withdrawInfo");
        if(info) info.textContent = "Çekilebilecek Bakiye: " + users[currentUser].balance + " TL";
    }
    const modal = document.getElementById(id);
    if(modal) modal.classList.remove("hidden");
}

function closeModals() {
    document.querySelectorAll('.modal').forEach(m => {
        if(m.id !== 'authModal') m.classList.add("hidden");
    });
}

function submitDeposit() {
    const amount = Number(document.getElementById("depositAmount").value);
    const name = document.getElementById("depositName").value.trim();
    if(!amount || amount <= 0 || !name) { alert("Lütfen tüm alanları doldurun."); return; }

    const reqId = Date.now();
    adminRequests.push({ id: reqId, type: 'deposit', user: currentUser, amount: amount, name: name, date: new Date().toLocaleDateString(), status: 'Bekliyor' });
    localStorage.setItem("wheelAdminReq", JSON.stringify(adminRequests));

    users[currentUser].history.unshift({ id: reqId, text: "+" + amount + " TL Yatırma", status: "Bekliyor", date: new Date().toLocaleDateString() });
    localStorage.setItem("wheelUsers", JSON.stringify(users));

    updateBalanceUI();
    closeModals();
    if(message) message.textContent = "Para yatırma talebiniz yönetici onayına gönderildi.";
}

function submitWithdraw() {
    const amount = Number(document.getElementById("withdrawAmount").value);
    const name = document.getElementById("withdrawName").value.trim();
    const iban = document.getElementById("withdrawIban").value.trim().toUpperCase();

    if(!amount || amount <= 0 || !name || !iban) { alert("Lütfen tüm alanları doldurun."); return; }
    if(!iban.startsWith("TR") || iban.length !== 26) { alert("Geçersiz IBAN! 26 hane olmalı."); return; }
    if(amount > users[currentUser].balance) { alert("Yetersiz bakiye!"); return; }

    users[currentUser].balance -= amount;
    localStorage.setItem("wheelUsers", JSON.stringify(users));

    const reqId = Date.now();
    adminRequests.push({ id: reqId, type: 'withdraw', user: currentUser, amount: amount, name: name, iban: iban, date: new Date().toLocaleDateString(), status: 'Bekliyor' });
    localStorage.setItem("wheelAdminReq", JSON.stringify(adminRequests));

    users[currentUser].history.unshift({ id: reqId, text: "-" + amount + " TL Çekim", status: "Bekliyor", date: new Date().toLocaleDateString() });
    localStorage.setItem("wheelUsers", JSON.stringify(users));

    updateBalanceUI();
    closeModals();
    if(message) message.textContent = "Çekim talebiniz alındı.";
}

function submitSupport() {
    const text = document.getElementById("supportMessage").value.trim();
    if(!text) { alert("Mesaj yazın."); return; }
    adminRequests.push({ id: Date.now(), type: 'support', user: currentUser, text: text, date: new Date().toLocaleDateString(), status: 'Bekliyor' });
    localStorage.setItem("wheelAdminReq", JSON.stringify(adminRequests));
    closeModals();
    if(message) message.textContent = "Destek talebi iletildi.";
}

function openAdminPanel() {
    let pass = prompt("Yönetici Şifresini Girin:");
    if (pass !== "BGSGDL_Admin_2026!#") { alert("Hatalı Şifre!"); return; }

    const listDiv = document.getElementById("adminRequestsList");
    if(!listDiv) return;
    listDiv.innerHTML = "";
    
    if(adminRequests.length === 0) {
        listDiv.innerHTML = "<div style='font-size:12px; color:#aaa; text-align:center;'>Talep yok.</div>";
    } else {
        adminRequests.forEach((req, index) => {
            if(req.status === 'Bekliyor') {
                listDiv.innerHTML += `<div class="admin-card">
                    <b>[${req.type.toUpperCase()}]</b> ${req.user} - ${req.amount || req.text}<br>
                    <button type="button" onclick="adminAction(${index}, 'approve')" style="background:#22c55e; color:white; border:none; padding:3px 6px; border-radius:4px; margin-top:4px; cursor:pointer;">Onayla</button>
                    <button type="button" onclick="adminAction(${index}, 'reject')" style="background:#ef4444; color:white; border:none; padding:3px 6px; border-radius:4px; margin-top:4px; cursor:pointer;">Reddet</button>
                </div>`;
            }
        });
    }
    const adminModal = document.getElementById("adminModal");
    if(adminModal) adminModal.classList.remove("hidden");
}

function adminAction(index, action) {
    let req = adminRequests[index];
    let targetUser = users[req.user];
    if(action === 'approve') {
        if((req.type === 'deposit' || req.type === 'withdraw') && targetUser) {
            if(req.type === 'deposit') targetUser.balance += req.amount;
            targetUser.history = targetUser.history.map(h => h.id === req.id ? {...h, status: "Onaylandı"} : h);
        }
        alert("Onaylandı.");
    } else {
        if(req.type === 'withdraw' && targetUser) {
            targetUser.balance += req.amount;
        }
        if(targetUser) targetUser.history = targetUser.history.map(h => h.id === req.id ? {...h, status: "Reddedildi"} : h);
        alert("Reddedildi.");
    }
    adminRequests.splice(index, 1);
    localStorage.setItem("wheelAdminReq", JSON.stringify(adminRequests));
    localStorage.setItem("wheelUsers", JSON.stringify(users));
    openAdminPanel();
    updateBalanceUI();
}

function openHistory() {
    const listDiv = document.getElementById("historyList");
    if(!listDiv || !currentUser || !users[currentUser]) return;
    listDiv.innerHTML = "";
    (users[currentUser].history || []).forEach(h => {
        let color = h.status === 'Onaylandı' ? '#4ade80' : (h.status === 'Reddedildi' ? '#f87171' : '#facc15');
        listDiv.innerHTML += `<div class="history-item"><span>${h.text}</span><span style="color:${color}; font-weight:bold;">${h.status}</span></div>`;
    });
    const historyModal = document.getElementById("historyModal");
    if(historyModal) historyModal.classList.remove("hidden");
}

const prizes = [100, 50, 20, 10, 10, 5, 5, 1, 1, 1, 1, 1, 1, 5, 5, 10, 10, 20, 50, 100];
const canvas = document.getElementById("wheel");
if(canvas) {
    const ctx = canvas.getContext("2d");
    let angle = 0, spinning = false;

    function draw() {
        const size = canvas.width, center = size / 2, radius = 280;
        const colors = ["#9333ea", "#0ea5e9", "#22c55e", "#f97316", "#ef4444"];
        ctx.clearRect(0, 0, size, size);
        const step = Math.PI * 2 / prizes.length;
        prizes.forEach((p, i) => {
            let start = angle + i * step, end = start + step;
            ctx.beginPath(); ctx.moveTo(center, center); ctx.arc(center, center, radius, start, end);
            ctx.closePath(); ctx.fillStyle = colors[i % colors.length]; ctx.fill();
            ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 4; ctx.stroke();
            ctx.save(); ctx.translate(center, center); ctx.rotate(start + step / 2);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 24px Arial"; ctx.textAlign = "right";
            ctx.fillText(p + " TL", radius - 25, 8); ctx.restore();
        });
        ctx.beginPath(); ctx.arc(center, center, 50, 0, Math.PI * 2);
        ctx.fillStyle = "#ca8a04"; ctx.fill(); ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 8; ctx.stroke();
        ctx.fillStyle = "#fde047"; ctx.font = "bold 30px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("★", center, center);
    }
    draw();

    const spinBtn = document.getElementById("spin");
    if(spinBtn) {
        spinBtn.onclick = () => {
            if (spinning || !currentUser) return;
            if (users[currentUser].balance < 10) { alert("Yetersiz bakiye! En az 10 TL gerekli."); return; }

            users[currentUser].balance -= 10;
            if(!users[currentUser].history) users[currentUser].history = [];
            users[currentUser].history.unshift({text: "Çeviri Ücreti: -10 TL", status: "Tamamlandı", date: new Date().toLocaleDateString()});
                        users[currentUser].history.unshift({text: "Çeviri Ücreti: -10 TL", status: "Tamamlandı", date: new Date().toLocaleDateString()});
            localStorage.setItem("wheelUsers", JSON.stringify(users));
            updateBalanceUI();

            spinning = true;
            spinBtn.disabled = true;
            if(message) message.textContent = "Çark dönüyor...";

            const rnd = Math.random() * 1000;
            let targetValue = 1;
            if (rnd < 2) targetValue = 100;
            else if (rnd < 8) targetValue = 50;
            else if (rnd < 40) targetValue = 20;
            else if (rnd < 150) targetValue = 10;
            else if (rnd < 450) targetValue = 5;
            else targetValue = 1;

            let matching = [];
            prizes.forEach((p, idx) => { if (p === targetValue) matching.push(idx); });
            const chosen = matching[Math.floor(Math.random() * matching.length)];

            const step = Math.PI * 2 / prizes.length;
            const targetAngle = -Math.PI / 2 - (chosen * step) - (step / 2);
            const extraTurns = 8 * Math.PI * 2;
            const currentAngle = angle;
            const relativeTarget = (targetAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            const currentMod = (currentAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            let diff = relativeTarget - currentMod;
            if (diff < 0) diff += Math.PI * 2;

            const finish = currentAngle + extraTurns + diff;
            const duration = 5000, begin = performance.now();

            function animate(now) {
                let t = Math.min(1, (now - begin) / duration);
                let ease = 1 - Math.pow(1 - t, 4);
                angle = currentAngle + (finish - currentAngle) * ease;
                draw();
                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    angle = finish; draw();
                    users[currentUser].balance += prizes[chosen];
                    users[currentUser].history.unshift({text: "Çarktan Kazanıldı: +" + prizes[chosen] + " TL", status: "Tamamlandı", date: new Date().toLocaleDateString()});
                    localStorage.setItem("wheelUsers", JSON.stringify(users));
                    updateBalanceUI();
                    if(message) message.textContent = "Tebrikler! " + prizes[chosen] + " TL kazandın!";
                    spinning = false; spinBtn.disabled = false;
                }
            }
            requestAnimationFrame(animate);
        };
    }
}

checkAuth();
</script>
</body>
</html>
